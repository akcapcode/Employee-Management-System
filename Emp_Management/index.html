<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Sky EMS</title>

<style>
/* ================= GLOBAL ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", sans-serif;
}

body{
    min-height:100vh;
    background: linear-gradient(135deg,#F4F7FB,#DCE8F8);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ================= TOP BAR ================= */
.top-bar{
    height:60px;
    background:linear-gradient(90deg,#3B82F6,#2563EB);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
    box-shadow:0 4px 14px rgba(37,99,235,0.25);
}

.logo{
    color:#FFFFFF;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
}

/* NAVBAR */
.navbar a{
    position:relative;
    color:#EFF6FF;
    text-decoration:none;
    padding:8px 18px;
    border-radius:22px;
    font-size:14px;
    font-weight:600;
    transition:0.4s;
    overflow:hidden;
}

.navbar a::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,0.25);
    opacity:0;
    transition:0.4s;
    z-index:-1;
    border-radius:22px;
}

.navbar a:hover{
    color:#FFFFFF;
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(37,99,235,0.35);
}

.navbar a:hover::before{
    opacity:1;
}

/* ================= LOGIN WRAPPER ================= */
.login-wrapper{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

/* ================= LOGIN CARD ================= */
.login-card{
    width:100%;
    max-width:420px;
    background:#FFFFFF;
    padding:45px;
    border-radius:30px;
    box-shadow:0 20px 45px rgba(30,58,138,0.18);
    text-align:center;
    animation:slideUp 1.1s ease forwards;
}

/* TITLE */
.login-card h1{
    font-size:32px;
    font-weight:800;
    background:linear-gradient(270deg,#1E3A8A,#2563EB,#0EA5E9);
    background-size:400% 400%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientMove 6s ease infinite;
}

.login-card p{
    font-size:15px;
    color:#475569;
    margin-top:10px;
    margin-bottom:30px;
}

/* LABEL */
.login-card label{
    display:block;
    text-align:left;
    font-weight:600;
    margin-bottom:6px;
    margin-top:18px;
    color:#1E3A8A;
}

/* INPUT */
.login-card input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #CBD5E1;
    font-size:15px;
    outline:none;
    background:#F8FAFC;
    color:#1F2937;
    transition:0.3s;
}

.login-card input::placeholder{
    color:#94A3B8;
}

.login-card input:focus{
    border-color:#2563EB;
    box-shadow:0 0 0 3px rgba(37,99,235,0.25);
}

/* BUTTON */
.login-card button{
    margin-top:30px;
    width:100%;
    padding:12px;
    background:linear-gradient(135deg,#2563EB,#1E3A8A);
    border:none;
    border-radius:25px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    color:#FFFFFF;
    transition:0.4s;
}

.login-card button:hover{
    transform:scale(1.05);
    box-shadow:0 8px 20px rgba(37,99,235,0.4);
}

/* FOOTER */
.login-footer{
    margin-top:25px;
    font-size:14px;
    color:#64748B;
}

/* ================= ANIMATIONS ================= */
@keyframes slideUp{
    from{opacity:0; transform:translateY(80px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="logo">Sky EMS</div>
    <div class="navbar">
        <a href="index.html">Login</a>
    </div>
</div>

<div class="login-wrapper">
    <div class="login-card">

        <h1>Welcome Back</h1>
        <p>Login to access Employee Management System</p>

        <form action="login" method="post">
            <label>Username</label>
            <input type="text" name="uname" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="pword" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <div class="login-footer">
            Secure login for authorized users only
        </div>

    </div>
</div>

</body>
</html>
